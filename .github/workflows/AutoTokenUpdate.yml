name: Update App Token

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  schedule:
    - cron: "4 * * * *"
  watch:
    types: [started]

# The job commits the refreshed token, so the GITHUB_TOKEN needs write access.
# Without this the push is rejected with "Permission ... denied to github-actions[bot]".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Set up Python
      uses: actions/setup-python@master
      with:
        python-version: 3.14
    - name: Install requests 
      run: |
        pip install requests
    - name: Read config from secrets
      env:
        CONFIG_ID: ${{ secrets.CONFIG_ID }}
        CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
        TENANT_ID: ${{ secrets.TENANT_ID }}
      run: |
        python update.py
    - name: Commit and push
      run: |
        git config --global user.email actions@github.com
        git config --global user.name "github-actions[bot]"
        git add refresh.txt
        if git diff --cached --quiet; then
          echo "No token change, nothing to commit"
          exit 0
        fi
        git commit -m "update new app token"
        git push origin HEAD:main
